name: Publish to Github Container Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  targets:
    name: List images
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.list.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List bake targets
        id: list
        run: |
          echo "targets=$(docker buildx bake --print | jq -c '.group.default.targets')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: targets

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker buildx bake \
            --push \
            --provenance=true \
            --set="*.cache-from=type=gha,scope=${{ matrix.target }}" \
            --set="*.cache-to=type=gha,mode=max,scope=${{ matrix.target }}" \
            "${{ matrix.target }}"
