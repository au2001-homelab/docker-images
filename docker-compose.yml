version: "3"

services:
  container-disk-debian12-cloud:
    image: ghcr.io/au2001-homelab/container-disk-debian12-cloud:latest
    build:
      context: ./container-disk-debian12-cloud
      x-bake:
        platforms:
        - linux/amd64
        - linux/arm64

  container-disk-windows11:
    image: ghcr.io/au2001-homelab/container-disk-windows11:latest
    build:
      context: ./container-disk-windows11
      x-bake:
        platforms:
        - linux/amd64

  container-disk-virtio-win:
    image: ghcr.io/au2001-homelab/container-disk-virtio-win:latest
    build:
      context: ./container-disk-virtio-win
      x-bake:
        platforms:
        - linux/amd64

  http-file-server:
    image: ghcr.io/au2001-homelab/http-file-server:latest
    build:
      context: ./http-file-server
      x-bake:
        platforms:
        - linux/amd64
